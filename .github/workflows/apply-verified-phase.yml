name: Apply verified phase

on:
  push:
    branches: [codex/phase-runner]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'run-phase')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Prepare phase inputs
        run: |
          if compgen -G '.codex/phase-patch/P16DOC-*' > /dev/null; then
            cat .codex/phase-patch/P16DOC-* | base64 -d | gzip -d > /tmp/phase.patch
          elif compgen -G '.codex/phase-patch/P16-*' > /dev/null; then
            cat .codex/phase-patch/P16-* | base64 -d | gzip -d > /tmp/phase.patch
          elif compgen -G '.codex/phase-patch/P15-*' > /dev/null; then
            cat .codex/phase-patch/P15-* | base64 -d | gzip -d > /tmp/phase.patch
          elif compgen -G '.codex/phase-patch/P14-*' > /dev/null; then
            cat .codex/phase-patch/P14-* | base64 -d | gzip -d > /tmp/phase.patch
          elif compgen -G '.codex/phase-patch/P13-*' > /dev/null; then
            head -c -1 .codex/phase-patch/P13-000 > /tmp/phase.patch
            sed 's#^ diff --git a/codec/smpp34.go#diff --git a/codec/smpp34.go#' .codex/phase-patch/P13-001 >> /tmp/phase.patch
            cat .codex/phase-patch/P13-00{2,3,4,5,6} >> /tmp/phase.patch
            head -c -1 .codex/phase-patch/P13-007 >> /tmp/phase.patch
            cat .codex/phase-patch/P13-008 >> /tmp/phase.patch
            head -c -1 .codex/phase-patch/P13-009 >> /tmp/phase.patch
            cat .codex/phase-patch/P13-01{0,1,2} >> /tmp/phase.patch
          elif compgen -G '.codex/phase-patch/PATCH.b64-*' > /dev/null; then
            cat .codex/phase-patch/PATCH.b64-* | base64 -d | gzip -d > /tmp/phase.patch
          else
            cat .codex/phase-patch/part-* > /tmp/phase.patch
          fi
          cp .codex/phase-patch/MESSAGE /tmp/MESSAGE
          cp .codex/phase-patch/VERIFY.sh /tmp/VERIFY.sh
          chmod +x /tmp/VERIFY.sh
      - name: Apply phase to current main
        run: |
          git fetch origin main
          git checkout -B phase-target origin/main
          git apply --index /tmp/phase.patch
      - name: Verify phase
        run: /tmp/VERIFY.sh
      - name: Commit phase to main
        run: |
          git config user.name 'Majid Darvishan'
          git config user.email 'majiddarvishan@users.noreply.github.com'
          git commit -m "$(cat /tmp/MESSAGE)"
          git push origin HEAD:main
