name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The module's declared floor (go.mod) and the newest release we support.
        go: ['1.25.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Enforce gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # golangci-lint v1 cannot read Go 1.26+ export data and action v7 only accepts v2,
      # so this is v2. Once per run, on the newest toolchain.
      - name: Lint
        if: matrix.go == '1.27.x'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Unit tests
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/unit.log"

      # The step log is awkward to read outside the web UI; surface failing tests as an annotation.
      - name: Report failing unit tests
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/unit.log" ] || exit 0
          lines=$(grep -E '^(--- FAIL|FAIL|panic:|    .*_test\.go:[0-9]+:)' "$RUNNER_TEMP/unit.log" | head -12 | sed 's/$/%0A/' | tr -d '\n')
          [ -z "$lines" ] || echo "::error title=Unit tests failed::${lines}"

      - name: Coverage floor
        if: matrix.go == '1.27.x'
        run: scripts/coverage.sh

      - name: Race tests
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/race.log"

      - name: Report failing race tests
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/race.log" ] || exit 0
          lines=$(grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE|    .*_test\.go:[0-9]+:)' "$RUNNER_TEMP/race.log" | head -12 | sed 's/$/%0A/' | tr -d '\n')
          [ -z "$lines" ] || echo "::error title=Race tests failed::${lines}"

      - name: Phase 18 fuzz smoke
        run: |
          # Anchored: -fuzz is a regular expression, and FuzzFramer is a prefix of FuzzFramerChunked.
          go test ./codec -run '^$' -fuzz='^FuzzFramer$' -fuzztime=2s
          go test ./codec -run '^$' -fuzz='^FuzzDecodePDU$' -fuzztime=2s
          go test ./codec -run '^$' -fuzz='^FuzzFramerChunked$' -fuzztime=2s
          go test ./codec -run '^$' -fuzz='^FuzzDecodePDU50$' -fuzztime=2s

      - name: Protocol and codec benchmarks
        run: go test -run '^$' -bench=. -benchmem ./protocol ./codec

      - name: Phase 17 performance smoke
        env:
          SMPP_BENCH_SESSIONS: 1,2,4,8
          SMPP_BENCH_PARALLELISM: 16
        run: |
          go test -run=^$ -bench=BenchmarkDeadlineHighOutstanding -benchmem -benchtime=300ms ./session
          go test -run=^$ -bench='Benchmark(InMemorySession|LocalhostTCP|LocalhostTLS)Bidirectional' -benchmem -benchtime=200ms ./internal/perflab

      - name: Phase 17 sustained resource-bound smoke
        env:
          SMPP_ACCEPTANCE: 1
          SMPP_ACCEPTANCE_DURATION: 2s
          SMPP_ACCEPTANCE_SESSION_COUNT: 1
          SMPP_ACCEPTANCE_CALLERS: 64
          SMPP_ACCEPTANCE_MIN_RPS: 1
        run: go test ./internal/perflab -run '^TestPhase17ReferenceAcceptance$' -count=1 -v

      - name: Phase 17 60-second soak
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[soak]')
        env:
          SMPP_ACCEPTANCE: 1
          SMPP_ACCEPTANCE_DURATION: 60s
          SMPP_ACCEPTANCE_SESSION_COUNT: 1
          SMPP_ACCEPTANCE_CALLERS: 128
          SMPP_ACCEPTANCE_MIN_RPS: 100000
        run: go test ./internal/perflab -run '^TestPhase17ReferenceAcceptance$' -count=1 -v

      - name: Enforce no direct unsafe imports
        run: |
          if go list -f '{{range .Imports}}{{.}}{{"\n"}}{{end}}{{range .TestImports}}{{.}}{{"\n"}}{{end}}{{range .XTestImports}}{{.}}{{"\n"}}{{end}}' ./... | grep -qx unsafe; then
            echo 'direct import of unsafe is not allowed by the current performance policy' >&2
            exit 1
          fi

      - name: Phase 17 profiled TCP run
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[profile]')
        env:
          SMPP_BENCH_SESSIONS: 1
          SMPP_BENCH_PARALLELISM: 16
          SMPP_BENCH_TX_BATCH: 32
        run: |
          go test -run=^$ -bench=BenchmarkLocalhostTCPBidirectional/sessions_1 -benchmem -benchtime=2s ./internal/perflab \
            -cpuprofile=/tmp/phase17-cpu.pprof \
            -memprofile=/tmp/phase17-heap.pprof \
            -mutexprofile=/tmp/phase17-mutex.pprof \
            -blockprofile=/tmp/phase17-block.pprof
          echo '=== CPU top ==='
          go tool pprof -top -nodecount=25 /tmp/phase17-cpu.pprof
          echo '=== Heap top ==='
          go tool pprof -top -nodecount=25 /tmp/phase17-heap.pprof
          echo '=== Mutex top ==='
          go tool pprof -top -nodecount=25 /tmp/phase17-mutex.pprof
          echo '=== Block top ==='
          go tool pprof -top -nodecount=25 /tmp/phase17-block.pprof

      - name: Phase 17 TCP scatter/gather batch experiment
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[batch]')
        env:
          SMPP_BENCH_SESSIONS: 1
          SMPP_BENCH_PARALLELISM: 16
        run: |
          for batch in 1 2 4 8 16 32; do
            echo "=== tx_batch=$batch ==="
            SMPP_BENCH_TX_BATCH="$batch" go test -run='a^' -bench=BenchmarkLocalhostTCPBidirectional/sessions_1 -benchmem -benchtime=750ms ./internal/perflab
          done
