name: Export current source

on:
  push:
    branches:
      - codex/export-current-2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pack source
        run: |
          mkdir -p /tmp/export
          tar --exclude=.git -czf /tmp/export/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: go-smpp-current-source-2
          path: /tmp/export/source.tar.gz
          if-no-files-found: error
          retention-days: 1
